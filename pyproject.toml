[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gnap-caep-risc"
version = "0.1.0"
description = "Server-side GNAP client with a registered key, key-bound tokens, and a CAEP and RISC receiver"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iya CyberSecurity Solutions, LLC" }]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gnap-caep-risc = "gnap_caep_risc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/rcbj/gnap-caep-risc-python"
Repository = "https://github.com/rcbj/gnap-caep-risc-python"
Issues = "https://github.com/rcbj/gnap-caep-risc-python/issues"
