[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnap-caep-risc"
version = "0.1.0"
description = "Server-side GNAP client with a registered key, key-bound tokens, and a CAEP and RISC receiver"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gnap-caep-risc = "gnap_caep_risc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
